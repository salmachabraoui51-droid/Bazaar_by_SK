<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription réussie - Bazaar by SK</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#e4e1db,#a68a50,#7A562C);
}

.card{
    width:700px;
    background:#fff;
    padding:50px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
    animation:show .7s ease;
    border-top:8px solid #7A562C;
}

@keyframes show{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.icon{
    width:110px;
    height:110px;
    background:#28a745;
    border-radius:50%;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    color:white;
    margin-bottom:25px;
    box-shadow:0 8px 20px rgba(40,167,69,.4);
}

h1{
    color:#7A562C;
    margin-bottom:20px;
    font-size:38px;
}

p{
    color:#555;
    font-size:21px;
    line-height:35px;
    margin-bottom:35px;
}

.logo{
    color:#7A562C;
    font-weight:bold;
    font-size:28px;
}

.logo span{
    color:#7A562C;
}

a{
    display:inline-block;
    text-decoration:none;
    padding:15px 45px;
    background:#7A562C;
    color:white;
    border-radius:50px;
    font-size:18px;
    font-weight:bold;
    transition:.4s;
}

a:hover{
    background:#5d4120;
    transform:translateY(-5px);
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

</style>

</head>
<body>

<div class="card">

    <div class="icon">
        <i class="fa-solid fa-check"></i>
    </div>

    <h1>Message envoyé ! 📩</h1>

    <p>
         Votre message a été envoyé avec succès.<br><br>

        Merci d'avoir contacté
        <span class="logo">Bazaar <span>by SK</span></span> 🏺<br><br>

         Nous avons bien reçu votre demande et nous vous répondrons dans les plus brefs délais.
    </p>

    <a href="Bazaar.php">
        <i class="fa-solid fa-house"></i> Retour à l'accueil
    </a>

</div>

</body>
</html>
